# Pipeline de logs do Gerenciador de Livros
# Fluxo: app.log (JSON, uma linha por evento) -> Logstash -> Elasticsearch -> Kibana

input {
  file {
    # Caminho absoluto DENTRO do container do Logstash (./logs do projeto montado em /logs)
    path => "/logs/app.log"
    start_position => "beginning"
    # Arquivo onde o Logstash anota até que ponto já leu, para não reenviar tudo a cada restart
    sincedb_path => "/usr/share/logstash/data/sincedb_app_log"
    # Cada linha do arquivo é um objeto JSON: o codec já transforma as chaves em campos
    codec => json
  }
}

filter {
  if "_jsonparsefailure" in [tags] {
    # Linha que não é JSON (ex.: algo escrito fora do logger).
    # O grok tenta extrair timestamp, nível e mensagem do texto puro.
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp}%{SPACE}%{LOGLEVEL:level}%{SPACE}(\[%{DATA:logger}\]%{SPACE})?%{GREEDYDATA:message}"
      }
      overwrite => ["message"]
      tag_on_failure => ["_grokparsefailure_texto"]
    }
  }

  if [logger] == "uvicorn.access" {
    # O JSON traz a linha de acesso inteira no campo message:
    #   172.18.0.1:54321 - "GET /ler?page=1 HTTP/1.1" 200
    # O grok quebra essa mensagem em campos pesquisáveis.
    grok {
      match => {
        "message" => "%{IP:client_ip}:%{INT:client_port} - \"%{WORD:http_method} %{URIPATHPARAM:http_path} HTTP/%{NUMBER:http_version}\" %{INT:http_status:int}"
      }
      tag_on_failure => ["_grokparsefailure_acesso"]
    }
  }

  # O timestamp gerado pela aplicação vira o @timestamp oficial do evento
  # (sem isso, o Kibana usaria a hora em que o Logstash leu a linha)
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS"]
    target => "@timestamp"
    timezone => "America/Sao_Paulo"
    remove_field => ["timestamp"]
  }

  mutate {
    uppercase => ["level"]
    remove_field => ["[event][original]"]
  }
}

output {
  elasticsearch {
    # host "elasticsearch" = nome do serviço no docker-compose; porta 9200 = API HTTP do Elasticsearch
    hosts => ["http://elasticsearch:9200"]
    # Um índice por dia facilita apagar logs antigos
    index => "livros-logs-%{+YYYY.MM.dd}"
  }

  # Mostra cada evento processado no terminal do container (útil para depurar)
  stdout {
    codec => rubydebug
  }
}
